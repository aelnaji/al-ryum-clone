      <style>
        /* ════════════════════════════════════════════
          CUSTOM EFFECTS
          ════════════════════════════════════════════ */

        /* ── ROUND CORNERS ON THE ABOUT-SECTION VIDEO ── */
        #about .overflow-hidden.relative:has(video),
        #about .overflow-hidden.relative:has(video) video,
        #about .overflow-hidden.relative:has(video) > div {
          border-radius: 1.5rem !important;
        }
        #about .overflow-hidden.relative:has(video) {
          overflow: hidden;
        }

        /* ── INTERACTIVE MENA MAP ANIMATIONS (mea-map) ── */
        @keyframes arcMeaDash { to { stroke-dashoffset: -440; } }
        @keyframes arcMeaPulse {
          0%   { r: 6; opacity: 0.85; }
          100% { r: 24; opacity: 0; }
        }

        /* ── CUSTOM SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(196, 155, 94, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(196, 155, 94, 0.6); }

        /* ── CURSOR GLOW ── */
        .cursor-glow {
          position: fixed;
          pointer-events: none;
          z-index: 9999;
          width: 400px;
          height: 400px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(200,168,110,0.08) 0%, transparent 60%);
          transform: translate(-50%, -50%);
          transition: opacity 0.4s ease;
          will-change: transform;
          opacity: 0;
        }

        /* ── NOISE OVERLAY ── */
        .noise-overlay {
          position: fixed;
          inset: 0;
          z-index: 9998;
          pointer-events: none;
          opacity: 0.025;
          mix-blend-mode: overlay;
          width: 100%;
          height: 100%;
        }

        /* ── PAGE TRANSITION FLASH ── */
        .page-flash {
          position: fixed;
          inset: 0;
          z-index: 9997;
          pointer-events: none;
          background: var(--accent, #C8A86E);
          opacity: 0;
          transition: opacity 0.15s ease;
        }
        .page-flash.active { opacity: 0.08; }

        /* ── SMOOTH APPEAR ON LOAD ── */
        #root { opacity: 0; transition: opacity 0.8s ease; }
        #root.app-ready { opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
          .cursor-glow, .noise-overlay, .page-flash { display: none; }
          #root { opacity: 1; }
        }

        /* ── NEW 3D SCROLL HERO (minimax build, three.js r182) ──
           The fixed 3D canvas (#al-ryum-3d-canvas) sits at z-index:0.
           Make the first hero section transparent and drop the old

    <body>
      <div class="cursor-glow" id="cursorGlow"></div>
      <canvas class="noise-overlay" id="noiseCanvas"></canvas>
      <div class="page-flash" id="pageFlash"></div>
      <div id="root"></div>

      

      <script>
        // ═══════════════════════════════════════════════
        // CURSOR GLOW
        // ═══════════════════════════════════════════════
        const glow = document.getElementById('cursorGlow');
        let gTimeout;
        document.addEventListener('mousemove', e => {
          clearTimeout(gTimeout);
          glow.style.opacity = '1';
          glow.style.transform = `translate(${e.clientX - 200}px, ${e.clientY - 200}px)`;
        });
        document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });

        // ═══════════════════════════════════════════════
        // NOISE TEXTURE — single frame (no loop, no perf hit)
        // ═══════════════════════════════════════════════
        (function makeNoise() {
          const nc = document.getElementById('noiseCanvas');
          if (!nc) return;
          const ctx = nc.getContext('2d');
          const w = window.innerWidth, h = window.innerHeight;
          nc.width = w; nc.height = h;
          const imgData = ctx.createImageData(w, h);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const v = Math.random() * 255;
            d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
          }
          ctx.putImageData(imgData, 0, 0);
        })();

        // ═══════════════════════════════════════════════
        // LENIS SMOOTH SCROLL + FADE IN
        // ═══════════════════════════════════════════════
        let lenis;

        function boot() {
          const root = document.getElementById('root');
          if (!root || !root.children.length) { setTimeout(boot, 300); return; }

          // Fade in the app
          root.classList.add('app-ready');

          // Init Lenis
          lenis = new Lenis({
            duration: 1.2,
            easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smoothWheel: true,
            wheelMultiplier: 0.85,
            touchMultiplier: 1.0
          });
          window.lenis = lenis; // expose for ScrollTrigger scrub sync
          function raf(time) {
            lenis.raf(time);
            if (window.ScrollTrigger) window.ScrollTrigger.update();
            requestAnimationFrame(raf);
          }
          requestAnimationFrame(raf);

          // Attach smooth anchor nav
          document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', e => {
              const h = a.getAttribute('href');
              if (!h || h === '#') return;
              const t = document.querySelector(h);
              if (t) {
                e.preventDefault();
                const pf = document.getElementById('pageFlash');
                pf.classList.add('active');
                lenis.scrollTo(t, {
                  duration: 1.2,
                  onComplete: () => { setTimeout(() => pf.classList.remove('active'), 200); }
                });
              }
            });
          });

          console.log('[Al Ryum] Lenis scroll active');
        }

        boot();
      </script>
    </body>
